<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Days Prayer Challenge</title>
    <link rel="stylesheet" href="pink-challenge-styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>30 Days Prayer Challenge</h1>
            <p class="challenge-description">A month of intentional prayer and spiritual growth</p>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-text" id="progressText">0/30 days completed</div>
            </div>
        </header>

        <main>
            <div class="challenges-grid" id="challengesContainer">
                <!-- Days will be added by JavaScript -->
            </div>
        </main>

        <div class="actions">
            <button id="resetProgress" class="btn-clear">Reset Progress</button>
            <button id="shareProgress" class="btn-share">Share Progress</button>
        </div>
    </div>

    <div id="shareModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Share Your Progress</h3>
            <p>You've completed <span id="shareCompleted">0</span> out of 30 days!</p>
            <div class="share-buttons">
                <button class="share-btn" data-platform="twitter"><i class="fab fa-twitter"></i> Twitter</button>
                <button class="share-btn" data-platform="facebook"><i class="fab fa-facebook"></i> Facebook</button>
                <button class="share-btn" id="copyLink"><i class="fas fa-link"></i> Copy Link</button>
            </div>
        </div>
    </div>

    <script src="pink-challenge-script.js"></script>
</body>
</html>
