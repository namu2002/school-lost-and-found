<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Lost & Found</title>

    <!-- Admin protection -->
    <script>
        if (localStorage.getItem('isAdmin') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>

    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            color: #667eea;
            font-size: 2em;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-header {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            color: white;
        }

        .btn-home {
            background: #457b9d;
        }

        .btn-home:hover {
            background: #2c5282;
        }

        .btn-logout {
            background: #e63946;
        }

        .btn-logout:hover {
            background: #d62828;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        .stat-card i {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 15px;
        }

        .stat-card h3 {
            font-size: 2.5em;
            color: #333;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-group input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .filter-group button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #667eea;
        }
    </style>
</head>

<body>

<div class="admin-container">

    <!-- Header -->
    <div class="admin-header">
        <div>
            <h1><i class="fas fa-tachometer-alt"></i> Admin Dashboard</h1>
            <p style="color:#666;">Manage all lost and found items</p>
        </div>

        <div class="header-actions">
            <button class="btn-header btn-home" onclick="goHome()">Home</button>
            <button class="btn-header btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-container">
        <div class="stat-card">
            <i class="fas fa-question-circle"></i>
            <h3 id="lostCount">0</h3>
            <p>Lost Items</p>
        </div>
        <div class="stat-card">
            <i class="fas fa-check-circle"></i>
            <h3 id="foundCount">0</h3>
            <p>Found Items</p>
        </div>
        <div class="stat-card">
            <i class="fas fa-box"></i>
            <h3 id="totalCount">0</h3>
            <p>Total Items</p>
        </div>
    </div>

    <!-- Lost Items -->
    <div class="section">
        <h2><i class="fas fa-search"></i> Lost Items</h2>
        <div class="filter-group">
            <input type="text" id="lostSearch" placeholder="Search lost items">
            <button onclick="filterLostItems()">Search</button>
            <button onclick="loadLostItems()">Refresh</button>
        </div>
        <div id="lostContainer" class="loading">Loading lost items...</div>
    </div>

    <!-- Found Items -->
    <div class="section">
        <h2><i class="fas fa-gift"></i> Found Items</h2>
        <div class="filter-group">
            <input type="text" id="foundSearch" placeholder="Search found items">
            <button onclick="filterFoundItems()">Search</button>
            <button onclick="loadFoundItems()">Refresh</button>
        </div>
        <div id="foundContainer" class="loading">Loading found items...</div>
    </div>

</div>

<!-- Page logic -->
<script>
    function logout() {
        localStorage.removeItem('isAdmin');
        window.location.href = 'login.html';
    }

    function goHome() {
        window.location.href = 'index.html';
    }
</script>

<script src="admin.js"></script>

</body>
</html>
